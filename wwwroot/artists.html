<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>BeatFlow API - Artistas</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="main-container">
        <div class="sidebar"><div class="ad-box" style="background:#F0F; color:#FFF;">TOQUES RBD!</div></div>
        <div class="center-panel">
            <h1>🎸 ÁREA DE ARTISTAS 🎸</h1>
            
            <button class="btn-add" onclick="document.getElementById('addModal').style.display='block'">+ NOVO ARTISTA</button>

            <div style="background:#000; padding:15px; border:2px double #FFF;">
                <table class="artist-table">
                    <thead><tr><th>ID</th><th>NOME</th><th>GÊNERO</th><th>AÇÃO</th></tr></thead>
                    <tbody id="tableContent"><tr><td colspan="4">Carregando...</td></tr></tbody>
                </table>
            </div>
            <div style="margin-top:20px;">
                <a href="/index.html" class="old-school"><< VOLTAR</a>
                <a href="/swagger" class="old-school">>> Swagger <<</a>
            </div>
        </div>
        <div class="sidebar"><div class="ad-box">DANÇA DO SIRI!</div></div>
    </div>

    <!-- Modal Adicionar Artista -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="document.getElementById('addModal').style.display='none'">&times;</span>
            <h2>Cadastrar Artista</h2>
            <form id="addArtistForm">
                <div class="form-group">
                    <label>Nome:</label>
                    <input type="text" id="artistName" required>
                </div>
                <div class="form-group">
                    <label>Gênero:</label>
                    <input type="text" id="artistGenre" required>
                </div>
                <button type="submit" class="btn-add">Salvar</button>
            </form>
        </div>
    </div>

    <script src="/js/script.js"></script>
    <script>
        async function load() {
            const res = await fetch('/artists');
            const result = await res.json();
            // result is { data: [...] } since we modified the endpoint to be paginated!
            const data = result.data || result;
            document.getElementById('tableContent').innerHTML = data.map(a => 
                `<tr><td>${a.id}</td><td>${a.name.toUpperCase()}</td><td>${a.genre?.toUpperCase() || ''}</td><td><button class='btn-del' onclick='del(${a.id})'>[X] EXCLUIR</button></td></tr>`
            ).join('') || '<tr><td colspan="4">Nenhum artista cadastrado.</td></tr>';
        }
        async function del(id) {
            if(confirm('Apagar artista?')) { await fetch('/artists/' + id, { method: 'DELETE' }); load(); }
        }
        
        document.getElementById('addArtistForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('artistName').value;
            const genre = document.getElementById('artistGenre').value;
            await fetch('/artists', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, genre })
            });
            document.getElementById('addModal').style.display='none';
            e.target.reset();
            load(); // recarrega a lista sem sair da página
        });

        load();
    </script>
</body>
</html>
